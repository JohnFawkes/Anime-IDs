name: Update Anime List

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      fresh_build:
        description: 'Delete anime_ids.json first so the run rebuilds the whole file from the sources'
        type: boolean
        default: false
      ignore_edits:
        description: 'Ignore anime_id_edits.json so the output is only what the sources produce'
        type: boolean
        default: false
  push:
  pull_request:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:

      - name: Get current date
        id: date
        run: echo "date=$(date +'%B %d, %Y %I:%M %p')" >> $GITHUB_OUTPUT

      - name: Check Out Repo
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Delete anime_ids.json
        if: inputs.fresh_build == true
        run: rm -f anime_ids.json

      - name: Run Update Anime IDs
        run: python update_anime_ids.py
        env:
          FRESH_BUILD: ${{ inputs.fresh_build }}
          IGNORE_EDITS: ${{ inputs.ignore_edits }}

      - name: Upload anime_ids.json
        if: inputs.fresh_build == true || inputs.ignore_edits == true
        uses: actions/upload-artifact@v4
        with:
          name: anime_ids
          path: anime_ids.json

      - name: Check Diff
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit & Push Changes
        if: steps.verify_diff.outputs.changed == 'true' && github.ref == 'refs/heads/master' && inputs.fresh_build != true && inputs.ignore_edits != true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git commit -m "Update at ${{ steps.date.outputs.date }} UTC" -a
          git push origin master

      - name: Open Pull Request for Manual Build
        if: steps.verify_diff.outputs.changed == 'true' && (inputs.fresh_build == true || inputs.ignore_edits == true)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="manual-build/${{ github.run_id }}"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git switch -c "$branch"
          git add -A
          git commit -m "Manual build at ${{ steps.date.outputs.date }} UTC"
          git push origin "$branch"
          {
            echo "Generated by a [manual run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) of Update Anime List, so the changes can be reviewed instead of landing straight on \`master\`."
            echo
            echo "| input | value |"
            echo "| --- | --- |"
            echo "| \`fresh_build\` | \`${{ inputs.fresh_build }}\` |"
            echo "| \`ignore_edits\` | \`${{ inputs.ignore_edits }}\` |"
            echo
            if [ "${{ inputs.ignore_edits }}" = "true" ]; then
              echo "> [!WARNING]"
              echo "> This build ignored \`anime_id_edits.json\`, so every ID those edits override is missing or reverted to its source value. **Do not merge this** - it exists to show what the sources produce on their own."
            else
              echo "Every ID here comes from the same sources and the same \`anime_id_edits.json\` a scheduled run uses, so this is safe to merge if the diff looks right."
            fi
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --base master --head "$branch" \
            --title "Manual build at ${{ steps.date.outputs.date }} UTC" \
            --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Report No Changes
        if: steps.verify_diff.outputs.changed != 'true' && (inputs.fresh_build == true || inputs.ignore_edits == true)
        run: |
          echo "### No changes to review" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This build produced an \`anime_ids.json\` identical to the one already on \`master\`, so there was nothing to open a pull request for." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The generated file is attached to this run as the **anime_ids** artifact." >> $GITHUB_STEP_SUMMARY

      - name: Discord Failure Notification
        uses: Kometa-Team/discord-notifications@master
        if: failure()
        with:
          webhook_id_token: ${{ secrets.BUILD_WEBHOOK }}
          message: ${{ vars.BUILD_FAILURE_ROLE }}
          title: "${{ vars.NAME }}: ${{ vars.TEXT_FAILURE }}"
          url: https://github.com/Kometa-Team/${{ vars.NAME }}/actions/runs/${{ github.run_id }}
          color: ${{ vars.COLOR_FAILURE }}
          username: ${{ vars.BOT_NAME }}
          avatar_url: ${{ vars.BOT_IMAGE }}
          author: ${{ vars.GIT_NAME }}
          author_icon_url: ${{ vars.GIT_IMAGE }}
